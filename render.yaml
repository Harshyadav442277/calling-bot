services:
  - type: web
    name: slotline
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: out
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: "24"
    headers:
      - path: /_next/static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
